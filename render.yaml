previews:
  generation: off

services:
  - type: web
    name: findguni-escape
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 20
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: aiven,render
      - key: FINDGUNI_BASE_URL
        fromService:
          type: web
          name: findguni-escape
          envVarKey: RENDER_EXTERNAL_URL
      - key: FINDGUNI_COOKIE_SECURE
        value: "true"
      - key: FINDGUNI_UPLOAD_DIR
        value: /tmp/findguni/uploads
      - key: THYMELEAF_CACHE
        value: "true"
      - key: TZ
        value: Asia/Seoul
      - key: ANSWER_HMAC_SECRET
        generateValue: true
      - key: FINDGUNI_REMEMBER_ME_KEY
        generateValue: true
