# Render Free web service: 512MB 메모리와 단일 인스턴스에 맞춘 설정
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20
server.tomcat.connection-timeout=20s

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=0
spring.flyway.connect-retries=3

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.query.plan_cache_max_size=128
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=32

spring.jmx.enabled=false
spring.main.lazy-initialization=false
spring.thymeleaf.cache=true
spring.web.resources.cache.period=365d
spring.web.resources.chain.cache=true
server.compression.enabled=true

server.servlet.session.cookie.secure=true
findguni.player-cookie.secure=true
findguni.upload-dir=${FINDGUNI_UPLOAD_DIR:/tmp/findguni/uploads}
