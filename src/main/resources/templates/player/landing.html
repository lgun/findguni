<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" th:content="${game.accentColor != null ? game.accentColor : '#635bff'}">
    <title th:text="|${game.title} · Findguni|">방탈출 · Findguni</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <script defer th:src="@{/js/app.js}" src="/js/app.js"></script>
    <script defer th:src="@{/js/audio.js}" src="/js/audio.js"></script>
</head>
<body class="player-body" th:attr="data-theme=${game.theme != null ? game.theme.name() : 'MIDNIGHT'}" th:style="|--accent:${game.accentColor};--accent-secondary:${game.secondaryColor};--game-bg:${game.backgroundColor};|">
<a class="skip-link" href="#main-content">게임 소개로 건너뛰기</a>
<header class="player-header">
    <div class="container player-header__inner">
        <a class="icon-btn" th:href="@{/games}" aria-label="게임 목록으로 돌아가기">←</a>
        <div class="player-header__title">Findguni</div>
        <span aria-hidden="true"></span>
    </div>
</header>
<main class="player-main stack" id="main-content">
    <div class="alert alert--danger" th:if="${error}" role="alert"><span aria-hidden="true">!</span><span th:text="${error}">게임을 불러오지 못했습니다.</span></div>
    <div class="alert alert--success" th:if="${success}" role="status"><span aria-hidden="true">✓</span><span th:text="${success}">준비되었습니다.</span></div>

    <section class="cover-hero" aria-labelledby="game-title">
        <img th:if="${game.coverImageUrl != null and !#strings.isEmpty(game.coverImageUrl)}" th:src="${game.coverImageUrl}" th:alt="|${game.title} 표지|" style="width:calc(100% + 2.5rem);max-width:none;margin:-1.25rem -1.25rem 1rem;aspect-ratio:16/10;object-fit:cover">
        <div class="cover-hero__content">
            <div class="cluster">
                <span class="preview-game-icon" th:text="${game.gameIcon != null ? game.gameIcon : '🔐'}" aria-hidden="true">🔐</span>
                <span class="badge badge--accent" th:text="${game.difficulty != null ? game.difficulty.displayName : '보통'}">보통</span>
                <span class="badge" th:text="|약 ${game.estimatedMinutes}분|">약 30분</span>
                <span class="badge" th:text="${game.flowMode != null and game.flowMode.name() == 'LINEAR' ? '선형 진행' : 'QR 자유 탐색'}">QR 자유 탐색</span>
            </div>
            <h1 id="game-title" th:text="${game.title}">게임 제목</h1>
            <p class="muted" th:text="${game.summary}">게임 한 줄 소개</p>
        </div>
    </section>

    <div th:replace="~{fragments/audio :: playerAudioCompact(${game}, '게임 배경 음악')}"></div>

    <section class="card card__body" aria-labelledby="intro-title">
        <p class="eyebrow">Your mission</p>
        <h2 class="section-title" id="intro-title">게임 안내</h2>
        <p style="white-space:pre-line" th:text="${game.intro != null and !#strings.isEmpty(game.intro) ? game.intro : (game.flowMode != null and game.flowMode.name() == 'LINEAR' ? '주변의 단서를 살피고 모든 문제를 순서대로 해결해 탈출하세요.' : '현장 곳곳의 QR을 찾아 문제와 단서를 자유롭게 발견하고 해결하세요.')}">게임 안내</p>
        <div class="game-facts">
            <div class="game-fact"><strong th:text="${game.difficulty != null ? game.difficulty.displayName : '보통'}">보통</strong><span>난이도</span></div>
            <div class="game-fact"><strong th:text="|${game.estimatedMinutes}분|">30분</strong><span>예상 시간</span></div>
            <div class="game-fact"><strong>모바일</strong><span>추천 환경</span></div>
        </div>
        <div class="inline-note">진행 상황은 이 브라우저에 연결된 익명 기기 토큰으로 안전하게 저장됩니다. 로그인이나 개인정보 입력은 필요하지 않습니다.</div>
    </section>

    <section class="card resume-card" th:if="${hasActiveSession}">
        <h2>진행 중인 게임이 있어요</h2>
        <p th:text="${game.flowMode != null and game.flowMode.name() == 'LINEAR' ? (currentStageNumber + '/' + stageCount + ' 문제에서 이어집니다.') : ((currentStageNumber - 1) + '/' + stageCount + ' 문제를 해결했습니다. QR 탐색을 이어가세요.')}">진행 중인 곳에서 이어집니다.</p>
        <div class="progress" role="progressbar" aria-label="게임 진행률" aria-valuemin="0" aria-valuemax="100" th:attr="aria-valuenow=${progressPercent != null ? progressPercent : 0}">
            <div class="progress__bar" th:style="|width:${progressPercent != null ? progressPercent : 0}%|"></div>
        </div>
        <a class="btn btn--block" th:href="@{/play/{slug}/stage(slug=${game.slug})}" style="margin-top:1rem">이어서 플레이</a>
        <form th:action="@{/play/{slug}/restart(slug=${game.slug})}" method="post" style="margin-top:.5rem">
            <button class="btn btn--quiet btn--block" type="submit" data-confirm="저장된 진행과 아이템을 지우고 처음부터 시작할까요?">처음부터 다시 시작</button>
        </form>
    </section>

    <form th:unless="${hasActiveSession}" th:action="@{/play/{slug}/start(slug=${game.slug})}" method="post">
        <button class="btn btn--block" type="submit">게임 시작하기</button>
    </form>
</main>
</body>
</html>
