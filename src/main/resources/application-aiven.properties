# Aiven 전용 실행 프로필
# 실행: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=aiven"
# 실제 접속값은 같은 저장소의 aiven-secrets.properties에 둡니다.
spring.config.import=classpath:aiven-secrets.properties

spring.datasource.url=jdbc:mysql://${aiven.mysql.host}:${aiven.mysql.port}/${aiven.mysql.database}?sslmode=require&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${aiven.mysql.username}
spring.datasource.password=${aiven.mysql.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Aiven Java/JDBC 연결에는 sslmode=require를 사용합니다.
# 내려받은 프로젝트 CA 원본은 certs/aiven-ca.pem에 함께 보관합니다.
findguni.aiven.ca-certificate=classpath:certs/aiven-ca.pem
