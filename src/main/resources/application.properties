server.port=${PORT:8080}
spring.application.name=findguni

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/findguni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:findguni}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:findguni-dev}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.web.resources.cache.period=0
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=34MB
server.error.whitelabel.enabled=false

findguni.public-base-url=${FINDGUNI_BASE_URL:http://localhost:8080}
findguni.answers.hmac-secret=${ANSWER_HMAC_SECRET:findguni-local-answer-secret-change-in-production}
findguni.player-cookie.secure=${FINDGUNI_COOKIE_SECURE:false}
findguni.upload-dir=${FINDGUNI_UPLOAD_DIR:./uploads}
findguni.security.remember-me-key=${FINDGUNI_REMEMBER_ME_KEY:findguni-local-remember-key-change-in-production}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${FINDGUNI_COOKIE_SECURE:false}
server.servlet.session.timeout=8h
