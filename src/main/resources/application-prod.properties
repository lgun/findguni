spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
findguni.player-cookie.secure=true
findguni.upload-dir=${FINDGUNI_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=34MB
findguni.public-base-url=${FINDGUNI_BASE_URL}
findguni.answers.hmac-secret=${ANSWER_HMAC_SECRET}
findguni.security.remember-me-key=${FINDGUNI_REMEMBER_ME_KEY}
